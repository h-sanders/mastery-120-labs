---
- name: Install and configure Nginx
  hosts: localhost
  become: yes
  vars_files:
    - vars.yml

  handlers:
    - name: restart_nginx
      service:
        name: "{{ app_name }}"
        state: restarted

  tasks:
    - name: Ensure Nginx is installed
      apt:
        name: "{{ app_name }}"
        state: present
        update_cache: yes

    - name: Ensure Nginx is running
      service:
        name: "{{ app_name }}"
        state: started
        enabled: yes

    - name: Create custom index page
      copy:
        dest: "{{ web_root }}/{{ index_page }}"
        content: |
          <html>
          <head><title>Ansible Deployed</title></head>
          <body>
          <h1>This server was provisioned by Ansible!</h1>
          <p>Hostname: {{ ansible_hostname }}</p>
          <p>OS: {{ ansible_distribution }} {{ ansible_distribution_version }}</p>
          <p>Deployed on: {{ ansible_date_time.date }}</p>
          <p>Port: {{ app_port }}</p>
          </body>
          </html>
      notify: restart_nginx
