---
- name: Install and configure Nginx
  hosts: localhost
  become: yes
  vars_files:
    - vars.yml
  vars:
    hostname: "{{ ansible_hostname }}"
    node_exporter_port: 9100

  handlers:
    - name: restart_nginx
      service:
        name: "{{ app_name }}"
        state: restarted

  tasks:
    - name: Ensure Nginx is installed
      apt:
        name: "{{ app_name }}"
        state: present
        update_cache: yes

    - name: Ensure Nginx is running
      service:
        name: "{{ app_name }}"
        state: started
        enabled: yes

    - name: Deploy custom index page from template
      template:
        src: templates/index.html.j2
        dest: "{{ web_root }}/{{ index_page }}"
        owner: root
        group: root
        mode: '0644'
      notify: restart_nginx
